<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cartesian-plot</title>
  </head>
  <body>
    <style>
      * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100vh;
      width:100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      display:flex;
      vertical-align: center;
      background-color: blanchedalmond;
      justify-content: center;
    align-items: center;
    }

    canvas {
      border: 2px solid whitesmoke;
    }
    #container {
      background-color: antiquewhite;
      height:90vh;
      width:90vw;
      display:flex;
      align-items: center;
      justify-content: center;
    }
    .point {
      position: absolute;
      width:10px;
      height:10px;
      background-color: red;
      border-radius: 50%;
    }
    #pointer {
      padding: 2em;
      font-family: monospace;
      position: absolute;
      left:0;
      top:0;
    }
    </style>
    <div id="container">
    </div>
    <div id="pointer">?</div>
    <div class="point" id="point-a"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
